services:
  # MySQL Database
  db:
    image: mysql:8.0
    container_name: test-mgmt-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-test_management_tool}
      MYSQL_USER: ${DB_USER:-test_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-test_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application (production image built from the Dockerfile)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-mgmt-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${DB_USER:-test_user}:${DB_PASSWORD:-test_password}@db:3306/${DB_NAME:-test_management_tool}
      # Required: compose refuses to start without it, so no publicly known default ever signs sessions
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (at least 32 random characters) in .env or the environment}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db_data:
    driver: local
